name: Update dependencies

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
  CACHIX_PUBLIC_KEY: ${{ vars.CACHIX_PUBLIC_KEY }}

jobs:
  update:
    name: Update ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: flake
            task: update-flake
          - name: eturnal
            task: update-eturnal
          - name: rust
            task: update-rust
          - name: providers
            task: update-providers
          - name: sygnal
            task: update-sygnal
          - name: go
            task: update-go
          - name: web-clients
            task: update-web-clients
            draft: true
    env:
      DRAFT_PR: ${{ matrix.draft || false }}
      UPDATE_NAME: ${{ matrix.name }}
      UPDATE_TASK: ${{ matrix.task }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for an existing pull request
        id: existing-pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/update-$UPDATE_NAME"
          if [[ $(gh pr list --head "$branch" --state open --json number --jq length) -gt 0 ]]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "An update pull request is already open for $UPDATE_NAME."
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Clean up runner
        if: steps.existing-pr.outputs.skip != 'true'
        run: ./scripts/ci/cleanup-runner.sh

      - name: Install Nix
        if: steps.existing-pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/install-nix.sh

      - name: Update
        if: steps.existing-pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix shell --inputs-from path:. nixpkgs#just -c just "$UPDATE_TASK"

      - name: Detect changes
        if: steps.existing-pr.outputs.skip != 'true'
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "$UPDATE_NAME is already up to date."
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Create update App token
        if: steps.changes.outputs.changed == 'true'
        id: update-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.UPDATE_APP_ID }}
          private-key: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: infra
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.update-app-token.outputs.token }}
        run: |
          set -euo pipefail

          : "${GH_TOKEN:?The dedicated update App must be configured before publishing}"
          branch="automation/update-$UPDATE_NAME"
          git config user.name infra-update[bot]
          git config user.email infra-update[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add -u
          git commit -m "chore: update $UPDATE_NAME"

          gh auth setup-git
          remote_oid=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          if [[ -n $remote_oid ]]; then
            git push --force-with-lease="refs/heads/$branch:$remote_oid" origin \
              "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi

          draft_args=()
          if [[ $DRAFT_PR == true ]]; then
            draft_args+=(--draft)
          fi

          gh pr create \
            "${draft_args[@]}" \
            --base main \
            --head "$branch" \
            --title "chore: update $UPDATE_NAME" \
            --body "Automated dependency update."
