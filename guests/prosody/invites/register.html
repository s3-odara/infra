<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アカウント作成 - {site_name}</title>
  <link rel="stylesheet" href="/invites_page/static/style.css">
</head>
<body>
  <main>
    <h1>{site_name}のアカウントを作成</h1>
    <p>招待を使ってXMPPアカウントを作成します。</p>

    {app&{app.supports_preauth_uri&
    <div class="notice">
      <p>{app.name}をインストール済みの場合は、アプリ内で登録を続けられます。</p>
      <p><a href="{uri}" rel="noopener noreferrer">{app.name}で招待を開く</a></p>
    </div>
    }}

    {message&<p class="error">登録できませんでした。ユーザー名、パスワード、招待の有効期限を確認してください。</p>}

    <form method="post">
      <label for="user">ユーザー名</label>
      <input id="user" type="text" name="user" required autofocus minlength="1" maxlength="30" autocomplete="username">
      <small>作成されるJIDは「ユーザー名@{domain}」です。</small>

      <label for="password">パスワード</label>
      <input id="password" type="password" name="password" required minlength="{password_policy.length}" autocomplete="new-password">
      <small>{password_policy.length}文字以上で、ほかのサービスでは使っていないパスワードを指定してください。</small>

      <input type="hidden" name="token" value="{token}">
      {app&<input type="hidden" name="app_id" value="{app.id}">}
      <button type="submit">アカウントを作成</button>
    </form>
  </main>
</body>
</html>
