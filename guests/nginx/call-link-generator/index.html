<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>ゲスト通話リンク作成</title>
    <link rel="stylesheet" href="/link/style.css">
    <script src="/link/app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>ゲスト通話リンク作成</h1>
      <p class="description">
        Matrixのroom IDまたはmatrix.toリンクから、Element Callのゲスト通話リンクを作成します。
        入力内容は外部へ送信されません。
      </p>

      <form id="generator">
        <label for="room">Room IDまたはmatrix.toリンク</label>
        <input
          id="room"
          name="room"
          type="text"
          required
          autocomplete="off"
          spellcheck="false"
          placeholder="!room-id:matrix.odarah.org"
        >

        <label for="name">リンクに表示する名前</label>
        <input id="name" name="name" type="text" value="通話" maxlength="128">

        <label for="via">経由するhomeserver</label>
        <input id="via" name="via" type="text" value="matrix.odarah.org" spellcheck="false">

        <label class="checkbox" for="encrypted">
          <input id="encrypted" name="encrypted" type="checkbox">
          暗号化room（per-participant E2EE）
        </label>

        <button type="submit">リンクを作成</button>
      </form>

      <section id="result" hidden aria-live="polite">
        <label for="output">ゲスト通話リンク</label>
        <div class="output-row">
          <input id="output" type="text" readonly>
          <button id="copy" type="button">コピー</button>
        </div>
        <a id="open" target="_blank" rel="noopener noreferrer">リンクを開く</a>
      </section>

      <p id="error" class="error" hidden role="alert"></p>
      <p class="notice">
        roomはあらかじめpublicまたはknockにし、MatrixRTCのmembership eventを送信できるpower levelにしてください。
      </p>
    </main>
  </body>
</html>
